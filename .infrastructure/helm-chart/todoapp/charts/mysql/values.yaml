namespace: mysql

replicas: 2

image:
  repository: mysql
  tag: "8.0"

database: app_db

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "500m"
    memory: "1Gi"

persistence:
  storage: 2Gi

tolerations:
  key: app
  operator: Equal
  value: mysql
  effect: NoSchedule

nodeAffinity:
  key: app
  values:
    - mysql

secrets:
  MYSQL_ROOT_PASSWORD: "MTIzNA=="
  MYSQL_USER: "YXBwX3VzZXI="
  MYSQL_PASSWORD: "MTIzNA=="
