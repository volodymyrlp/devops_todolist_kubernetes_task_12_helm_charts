namespace: todoapp

serviceAccountName: secrets-reader

image:
  repository: ikulyk404/todoapp
  tag: "4.0.1"

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

nodeAffinity:
  key: app
  values:
    - kube2py

service:
  port: 80
  targetPort: 8080
  nodePort: 30007

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 70

persistence:
  pvCapacity: 1Gi
  pvcStorage: 1Gi

configmap:
  PYTHONUNBUFFERED: "1"

# Значення у base64. DB_NAME та DB_HOST перекодовані БЕЗ кінцевого \n
# (в оригінальному secret.yml був баг: echo замість echo -n, через що
# DB_HOST не резолвився і застосунок падав).
