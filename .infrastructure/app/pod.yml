apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
    - name: todoapp
      image: ikulyk404/todoapp:4.0.1
      ports:
        - containerPort: 8080
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DB_NAME
          value: app_db
        - name: DB_USER
          value: app_user
        - name: DB_PASSWORD
          value: "1234"
        - name: DB_HOST
          value: mysql-0.mysql.mysql.svc.cluster.local
      resources:
        requests:
          memory: "256Mi"
          cpu: "150m"
        limits:
          memory: "256Mi"
          cpu: "150m"
      livenessProbe:
        httpGet:
          path: api/health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: api/ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
